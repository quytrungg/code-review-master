[alembic]
# Path to migration scripts. Kept absolute-ish via %(here)s so the CLI works from anywhere.
script_location = %(here)s/alembic
prepend_sys_path = .
version_path_separator = os

# The database URL is supplied at runtime from DATABASE_URL (see app/core/config.py
# and alembic/env.py). Nothing here is hard-coded so SQLite and PostgreSQL share the
# same migration history.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
